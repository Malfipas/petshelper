<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>方向 A · 系统原生</title>
<style>
  :root{
    --bg1:#eef2f7; --bg2:#dfe6ef;
    --glass:rgba(255,255,255,.72);
    --line:#c9d4e3; --ink:#1f2937; --ink2:#5b6676;
    --accent:#2563eb; --accent-soft:#e8effd;
    --r:10px; --shadow:0 12px 32px rgba(30,50,80,.16);
    --f:"Microsoft YaHei UI","PingFang SC","Hiragino Sans GB",system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{font-family:var(--f);color:var(--ink);background:linear-gradient(160deg,var(--bg1),var(--bg2));overflow:hidden}

  /* 桌面与示例窗口 */
  .win{position:absolute;left:120px;top:110px;width:min(900px,64vw);height:auto;background:#fff;
       border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);overflow:hidden}
  .win .bar{display:flex;align-items:center;gap:8px;padding:10px 14px;background:#f4f7fb;border-bottom:1px solid var(--line)}
  .dot{width:11px;height:11px;border-radius:50%}
  .win .t{font-size:13px;color:var(--ink2);margin-left:6px}
  .win .body{padding:26px 30px}
  .win h1{font-size:19px;margin:0 0 14px;font-weight:600}
  .rule{height:12px;border-radius:6px;background:#eef1f6;margin:10px 0}
  .rule.s{width:62%}
  .rule.m{width:84%}

  /* 控制条：原型自用，不属于产品 */
  .hud{position:fixed;left:22px;top:20px;z-index:40;display:flex;flex-wrap:wrap;gap:8px;max-width:520px}
  .hud button{min-height:36px;padding:7px 12px;font-size:13px;font-family:var(--f);color:var(--ink);
    background:var(--glass);border:1px solid var(--line);border-radius:8px;cursor:pointer;backdrop-filter:blur(8px)}
  .hud button:hover{background:#fff}
  .hud .tag{font-size:12px;color:var(--ink2);padding:8px 4px}

  /* 宠物 */
  .pet{position:fixed;right:0;z-index:30;cursor:pointer;user-select:none;
       transform-origin:bottom right;transition:transform .22s ease}
  .pet img{display:block;width:auto}
  .pet .collapsed{height:240px}
  .pet .expanded{height:360px;display:none}
  .pet.is-expanded .collapsed{display:none}
  .pet.is-expanded .expanded{display:block}
  .pet .collapsed{animation:breathe 4.2s ease-in-out infinite}
  @keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.015)}}

  /* 悬停小面板 */
  .panel{position:fixed;z-index:31;width:320px;padding:16px;background:var(--glass);
    border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);backdrop-filter:blur(14px);
    opacity:0;transform:translateX(8px);pointer-events:none;transition:opacity .16s ease,transform .16s ease}
  .panel.on{opacity:1;transform:none;pointer-events:auto}
  .panel .pname{font-size:15px;font-weight:600}
  .panel .track{display:flex;gap:5px;margin:10px 0 12px}
  .panel .track i{flex:1;height:4px;border-radius:2px;background:#d8e0ec}
  .panel .track i.done{background:var(--accent)}
  .panel .step{font-size:14px;line-height:1.6;margin:0 0 4px}
  .panel .meta{font-size:12px;color:var(--ink2);margin-bottom:12px}
  .panel .ai{display:flex;gap:8px;margin-bottom:12px}
  .panel .ai input{flex:1;min-height:36px;padding:8px 10px;font-size:13px;font-family:var(--f);
    border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink)}
  .panel .ai button{display:flex;align-items:center;justify-content:center;width:42px;min-height:36px;
    padding:0;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink2);cursor:pointer;
    transition:color .15s,border-color .15s,background .15s}
  .panel .ai button:hover{color:var(--accent);border-color:var(--accent);background:var(--accent-soft)}
  .panel .go{width:100%;min-height:44px;border:0;border-radius:9px;background:var(--accent);color:#fff;
    font-size:15px;font-family:var(--f);cursor:pointer}
  .panel .go:hover{filter:brightness(1.06)}
  .panel .skip{margin-top:8px;text-align:center;font-size:12px;color:var(--ink2);cursor:pointer}

  /* 主界面 */
  .main{position:fixed;right:0;top:0;height:100%;width:720px;z-index:29;padding:28px 30px 28px 32px;
    background:rgba(250,252,255,.92);border-left:1px solid var(--line);backdrop-filter:blur(18px);
    transform:translateX(100%);transition:transform .26s ease;overflow:auto}
  .main.on{transform:none}
  .main header{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}
  .main h2{font-size:16px;margin:0;font-weight:600}
  .newp{min-height:36px;padding:0 12px;font-size:13px;border:1px solid var(--line);border-radius:8px;
    background:#fff;cursor:pointer}
  .cards{display:flex;gap:14px;overflow-x:auto;padding-bottom:8px}
  .card{flex:0 0 198px;padding:16px;background:#fff;border:1px solid var(--line);border-radius:var(--r)}
  .card .cn{font-size:14px;font-weight:600;margin-bottom:10px}
  .card .pct{font-size:26px;font-weight:600;color:var(--accent);letter-spacing:-.5px}
  .card .pct small{font-size:12px;color:var(--ink2);font-weight:400;margin-left:2px}
  .card .nx{font-size:13px;color:var(--ink2);line-height:1.5;margin-top:10px;min-height:38px}
  .mods{display:flex;gap:10px;margin-top:22px;flex-wrap:wrap}
  .mods a{display:flex;align-items:center;min-height:44px;padding:0 16px;font-size:13px;color:var(--ink);
    text-decoration:none;background:#fff;border:1px solid var(--line);border-radius:8px}
  .mods a:hover{border-color:var(--accent);color:var(--accent)}

  /* 气泡 */
  .bubble{position:fixed;z-index:32;max-width:300px;padding:13px 15px;border-radius:12px;background:#fff;
    border:1px solid var(--line);box-shadow:var(--shadow);font-size:13px;line-height:1.6;
    opacity:0;transform:translateY(6px);pointer-events:none;transition:opacity .18s ease,transform .18s ease}
  .bubble.on{opacity:1;transform:none;pointer-events:auto}
  .bubble.deadline{border-left:4px solid #d94a3d}
  .bubble .bt{font-size:12px;color:#d94a3d;font-weight:600;margin-bottom:6px}
  .bubble.report .bt{color:var(--accent)}
  .bubble .bx{display:flex;justify-content:space-between;align-items:center;margin-top:10px;font-size:12px;color:var(--ink2)}
  .bubble .bx button{min-height:30px;padding:0 10px;font-size:12px;border:1px solid var(--line);
    border-radius:6px;background:#fff;cursor:pointer}

  /* 事件日志 */
  .console{position:fixed;left:22px;bottom:20px;width:360px;max-height:190px;overflow:auto;z-index:41;
    padding:10px 12px;font-size:12px;line-height:1.7;color:#3c4657;background:rgba(255,255,255,.86);
    border:1px solid var(--line);border-radius:10px;backdrop-filter:blur(8px)}
  .console b{font-weight:600;color:var(--ink)}
  .console div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
</style>
</head>
<body>

<div class="win">
  <div class="bar">
    <span class="dot" style="background:#ff5f57"></span>
    <span class="dot" style="background:#febc2e"></span>
    <span class="dot" style="background:#28c840"></span>
    <span class="t">thesis.docx — 第三章</span>
  </div>
  <div class="body">
    <h1>第三章 结论</h1>
    <div class="rule m"></div><div class="rule"></div><div class="rule s"></div>
    <div class="rule m"></div><div class="rule s"></div>
  </div>
</div>

<div class="hud">
  <span class="tag">原型控制</span>
  <button data-act="form">切换面板形态 A / B</button>
  <button data-act="deadline">截止强提醒</button>
  <button data-act="report">开机播报</button>
  <button data-act="fullscreen">全屏降级</button>
  <button data-act="reset">重置位置</button>
</div>

<aside class="panel" id="panel">
  <div id="formA">
    <div class="pname">毕业论文</div>
    <div class="track"><i class="done"></i><i class="done"></i><i class="done"></i><i></i><i></i><i></i><i></i></div>
    <p class="step">把第三章结论写成三句话</p>
    <div class="meta">第 3 步 / 共 7 步 · 约 5 分钟</div>
  </div>
  <div id="formB" style="display:none">
    <div class="pname">回面试邮件</div>
    <div class="meta">独立事务 · 不属于任何项目</div>
  </div>
  <div class="ai">
    <input id="ask" placeholder="有什么我能帮助你的吗？">
    <button id="send" aria-label="发送">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7"
           stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M21.5 2.5 10.8 21.3l-2.4-7.1-6.9-2.4z"></path>
        <path d="M21.5 2.5 8.4 14.2"></path>
      </svg>
    </button>
  </div>
  <button class="go" id="start">开始</button>
  <div class="skip" id="skip">不做</div>
</aside>

<section class="main" id="main">
  <header>
    <h2>我的项目</h2>
    <button class="newp">新建项目</button>
  </header>
  <div class="cards">
    <div class="card"><div class="cn">毕业论文</div><div class="pct">42<small>%</small></div><div class="nx">下一步：把第三章结论写成三句话</div></div>
    <div class="card"><div class="cn">配音练习</div><div class="pct">18<small>%</small></div><div class="nx">下一步：录一段 60 秒的开场白</div></div>
    <div class="card"><div class="cn">求职</div><div class="pct">65<small>%</small></div><div class="nx">下一步：回面试邮件，约时间</div></div>
  </div>
  <div class="mods">
    <a href="#">记录与进度</a><a href="#">想法收件箱</a><a href="#">设置</a>
  </div>
</section>

<div class="bubble" id="bubble"></div>

<div class="pet" id="pet">
  <img class="collapsed" src="../../assets/桌宠/常驻右-240.png" alt="桌宠收起态">
  <img class="expanded" src="../../assets/桌宠/展开-360.png" alt="桌宠展开态">
</div>

<div class="console" id="log"><div><b>事件</b>：等待操作</div></div>

<script>
(function(){
  var pet=document.getElementById('pet'), panel=document.getElementById('panel'),
      main=document.getElementById('main'), bubble=document.getElementById('bubble'),
      logBox=document.getElementById('log'), formA=document.getElementById('formA'),
      formB=document.getElementById('formB'), ask=document.getElementById('ask');

  var hoverIn=null, hoverOut=null, expanded=false, form='A', bubbleTimer=null;

  pet.style.top = (localStorage.getItem('petTop') || Math.round(innerHeight*0.42)) + 'px';

  function log(name, extra){
    var d=document.createElement('div');
    d.innerHTML='<b>'+name+'</b>'+(extra?' · '+extra:'');
    logBox.appendChild(d); logBox.scrollTop=logBox.scrollHeight;
  }
  function setExpanded(v){
    expanded=v;
    pet.classList.toggle('is-expanded', v);
    log(v?'evt_appear (展开)':'evt_appear (收起)');
  }
  function openPanel(){
    var r=pet.getBoundingClientRect();
    panel.style.top = Math.max(16, Math.min(innerHeight-260, r.top+40))+'px';
    panel.style.right = (r.width-20)+'px';
    panel.classList.add('on'); log('evt_step_shown');
  }
  function closePanel(){ panel.classList.remove('on'); }

  pet.addEventListener('pointerenter', function(){
    clearTimeout(hoverOut);
    hoverIn=setTimeout(openPanel, 300);
  });
  pet.addEventListener('pointerleave', function(){
    clearTimeout(hoverIn);
    hoverOut=setTimeout(closePanel, 500);
  });
  panel.addEventListener('pointerenter', function(){ clearTimeout(hoverOut); });
  panel.addEventListener('pointerleave', function(){ hoverOut=setTimeout(closePanel, 500); });

  pet.addEventListener('click', function(e){
    if(dragMoved) return;
    if(!expanded){ setExpanded(true); main.classList.add('on'); log('evt_panel_open','主界面滑出'); }
    else { setExpanded(false); main.classList.remove('on'); }
  });

  // 拖拽移动并记住
  var dragging=false, startY=0, startTop=0, dragMoved=false;
  pet.addEventListener('pointerdown', function(e){
    dragging=true; dragMoved=false; startY=e.clientY; startTop=parseFloat(pet.style.top)||0;
    pet.setPointerCapture(e.pointerId);
  });
  pet.addEventListener('pointermove', function(e){
    if(!dragging) return;
    var dy=e.clientY-startY;
    if(Math.abs(dy)>4) dragMoved=true;
    var top=Math.max(0, Math.min(innerHeight-360, startTop+dy));
    pet.style.top=top+'px'; localStorage.setItem('petTop', Math.round(top));
  });
  pet.addEventListener('pointerup', function(){ dragging=false; setTimeout(function(){dragMoved=false;},50); });

  document.getElementById('start').addEventListener('click', function(){
    log('evt_start','项目=毕业论文'); closePanel();
  });
  document.getElementById('skip').addEventListener('click', function(){
    log('evt_skip','悬停面板'); closePanel();
  });
  document.getElementById('send').addEventListener('click', function(){
    if(!ask.value.trim()) return;
    log('问 AI', ask.value.slice(0,12));
    ask.value=''; ask.placeholder='答：先写一句话，用来占位';
    ask.blur();
  });

  function showBubble(kind){
    var r=pet.getBoundingClientRect();
    bubble.className='bubble on '+(kind==='deadline'?'deadline':'report');
    bubble.innerHTML = kind==='deadline'
      ? '<div class="bt">今天 23:59 截止</div>笔试确认邮件需要回复，不回就没有这次机会。<div class="bx"><span>不自动消失</span><button id="ok">知道了</button></div>'
      : '<div class="bt">开机播报</div>毕业论文 42%，已 3 天未推进；配音练习 18%，昨天推进过。<div class="bx"><span>15 秒后自动收起</span><button id="ok2">查看</button></div>';
    bubble.style.top = Math.max(12, r.top-8)+'px';
    bubble.style.right = (r.width+16)+'px';
    log(kind==='deadline'?'evt_bubble_show (截止强提醒)':'evt_bubble_show (开机播报)');
    clearTimeout(bubbleTimer);
    var btn=bubble.querySelector('#ok')||bubble.querySelector('#ok2');
    btn.addEventListener('click', function(){ bubble.classList.remove('on'); });
    if(kind!=='deadline') bubbleTimer=setTimeout(function(){ bubble.classList.remove('on'); log('evt_bubble_ignore','开机播报'); }, 15000);
  }

  document.querySelector('.hud').addEventListener('click', function(e){
    var act=e.target.dataset.act; if(!act) return;
    if(act==='form'){ form=form==='A'?'B':'A'; formA.style.display=form==='A'?'':'none'; formB.style.display=form==='B'?'':'none'; openPanel(); }
    if(act==='deadline') showBubble('deadline');
    if(act==='report') showBubble('report');
    if(act==='fullscreen'){ pet.style.display=pet.style.display==='none'?'':'none'; log('全屏降级','宠物隐藏'); }
    if(act==='reset'){ localStorage.removeItem('petTop'); pet.style.top=Math.round(innerHeight*0.42)+'px'; }
  });

  document.addEventListener('keydown', function(e){
    if(e.key==='Escape'){ closePanel(); if(expanded){ setExpanded(false); main.classList.remove('on'); } bubble.classList.remove('on'); }
  });
  main.addEventListener('click', function(e){ if(e.target===main) { setExpanded(false); main.classList.remove('on'); } });
})();
</script>
</body>
</html>
