<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>方向 C · 深色终端</title>
<style>
  :root{
    --bg:#0d1013; --bg2:#12171c; --line:#243039; --line2:#2e3c47;
    --ink:#e6edf3; --ink2:#8b9aa8; --amber:#f0b429; --dim:#1a2127;
    --mono:"JetBrains Mono","Cascadia Mono",Consolas,"Microsoft YaHei UI",monospace;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{font-family:var(--mono);color:var(--ink);overflow:hidden;
    background:radial-gradient(circle at 78% 18%, #16202a, var(--bg) 55%);}
  body::before{content:"";position:fixed;inset:0;pointer-events:none;
    background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);
    background-size:64px 64px;opacity:.16}

  .win{position:absolute;left:104px;top:92px;width:min(860px,60vw);background:var(--bg2);
    border:1px solid var(--line2)}
  .win .bar{display:flex;align-items:center;gap:12px;padding:9px 14px;border-bottom:1px solid var(--line);font-size:12px;color:var(--ink2)}
  .win .bar .live{width:7px;height:7px;background:var(--amber);border-radius:50%}
  .win .body{padding:28px 32px}
  .win h1{font-size:18px;margin:0 0 18px;font-weight:500;letter-spacing:1px;color:var(--ink)}
  .rule{height:1px;background:var(--line);margin:15px 0}
  .rule.s{width:58%}

  .hud{position:fixed;left:22px;top:18px;z-index:40;display:flex;flex-wrap:wrap;gap:8px;max-width:560px}
  .hud button{min-height:34px;padding:6px 12px;font-size:12px;font-family:var(--mono);color:var(--ink2);
    background:var(--dim);border:1px solid var(--line2);cursor:pointer;letter-spacing:.4px}
  .hud button:hover{color:var(--amber);border-color:var(--amber)}
  .hud .tag{font-size:11px;color:var(--ink2);padding:9px 4px;letter-spacing:1.5px}

  .pet{position:fixed;right:0;z-index:30;cursor:pointer;user-select:none;transform-origin:bottom right;
    filter:drop-shadow(0 0 22px rgba(240,180,41,.16))}
  .pet img{display:block;width:auto}
  .pet .collapsed{height:240px;animation:breathe 4.2s ease-in-out infinite}
  .pet .expanded{height:360px;display:none}
  .pet.is-expanded .collapsed{display:none}
  .pet.is-expanded .expanded{display:block}
  @keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.015)}}

  .panel{position:fixed;z-index:31;width:328px;padding:18px;background:#10161b;
    border:1px solid var(--line2);box-shadow:0 0 0 1px rgba(240,180,41,.10),0 18px 40px rgba(0,0,0,.5);
    opacity:0;transform:translateX(6px);pointer-events:none;transition:opacity .16s,transform .16s}
  .panel.on{opacity:1;transform:none;pointer-events:auto}
  .panel .pname{font-size:15px;color:var(--amber);letter-spacing:.6px}
  .panel .track{display:flex;gap:4px;margin:12px 0 12px}
  .panel .track i{flex:1;height:3px;background:var(--line2)}
  .panel .track i.done{background:var(--amber)}
  .panel .step{font-size:14px;line-height:1.7;margin:0 0 6px}
  .panel .meta{font-size:11px;color:var(--ink2);margin-bottom:14px;letter-spacing:.8px}
  .panel .ai{display:flex;gap:8px;margin-bottom:14px}
  .panel .ai input{flex:1;min-height:36px;padding:8px 10px;font-size:12px;font-family:var(--mono);
    color:var(--ink);background:#0b1014;border:1px solid var(--line2)}
  .panel .ai input:focus{outline:none;border-color:var(--amber)}
  .panel .ai button{min-height:36px;padding:0 12px;font-size:12px;font-family:var(--mono);color:var(--ink2);
    background:#0b1014;border:1px solid var(--line2);cursor:pointer}
  .panel .go{width:100%;min-height:44px;border:1px solid var(--amber);background:transparent;color:var(--amber);
    font-size:14px;font-family:var(--mono);letter-spacing:4px;cursor:pointer}
  .panel .go:hover{background:rgba(240,180,41,.12)}
  .panel .skip{margin-top:10px;text-align:center;font-size:11px;color:var(--ink2);cursor:pointer;letter-spacing:1px}

  .main{position:fixed;right:0;top:0;height:100%;width:720px;z-index:29;padding:30px 32px;
    background:rgba(14,19,24,.96);border-left:1px solid var(--line2);backdrop-filter:blur(10px);
    transform:translateX(100%);transition:transform .26s ease;overflow:auto}
  .main.on{transform:none}
  .main header{display:flex;align-items:center;justify-content:space-between;
    border-bottom:1px solid var(--line2);padding-bottom:12px;margin-bottom:22px}
  .main h2{font-size:13px;margin:0;font-weight:400;letter-spacing:3px;color:var(--ink2)}
  .newp{min-height:32px;padding:0 12px;font-size:12px;font-family:var(--mono);color:var(--amber);
    background:transparent;border:1px solid var(--line2);cursor:pointer}
  .cards{display:flex;gap:14px;overflow-x:auto;padding-bottom:8px}
  .card{flex:0 0 200px;padding:16px;background:#10161b;border:1px solid var(--line2);border-top:2px solid var(--amber)}
  .card .cn{font-size:13px;color:var(--ink2);letter-spacing:1px;margin-bottom:12px}
  .card .pct{font-size:30px;color:var(--ink);letter-spacing:-1px}
  .card .pct small{font-size:12px;color:var(--amber);margin-left:3px}
  .card .nx{font-size:12px;color:var(--ink2);line-height:1.7;margin-top:12px;min-height:42px}
  .mods{display:flex;gap:10px;margin-top:26px;flex-wrap:wrap}
  .mods a{display:flex;align-items:center;min-height:44px;padding:0 16px;font-size:12px;color:var(--ink2);
    text-decoration:none;border:1px solid var(--line2);letter-spacing:1px}
  .mods a:hover{color:var(--amber);border-color:var(--amber)}

  .bubble{position:fixed;z-index:32;max-width:300px;padding:14px 16px;background:#10161b;
    border:1px solid var(--line2);font-size:12px;line-height:1.8;color:var(--ink);
    opacity:0;transform:translateY(6px);pointer-events:none;transition:opacity .18s,transform .18s}
  .bubble.on{opacity:1;transform:none;pointer-events:auto}
  .bubble.deadline{border-left:3px solid #ff5c4d}
  .bubble .bt{font-size:11px;letter-spacing:1.5px;color:#ff5c4d;margin-bottom:8px}
  .bubble.report .bt{color:var(--amber)}
  .bubble .bx{display:flex;justify-content:space-between;align-items:center;margin-top:10px;font-size:11px;color:var(--ink2)}
  .bubble .bx button{min-height:30px;padding:0 10px;font-size:11px;font-family:var(--mono);
    color:var(--amber);background:transparent;border:1px solid var(--line2);cursor:pointer}

  .console{position:fixed;left:22px;bottom:18px;width:370px;max-height:180px;overflow:auto;z-index:41;
    padding:10px 12px;font-size:11px;line-height:1.9;color:var(--ink2);background:rgba(10,14,18,.9);
    border:1px solid var(--line2)}
  .console b{color:var(--amber);font-weight:400}
  .console div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
</style>
</head>
<body>

<div class="win">
  <div class="bar"><span class="live"></span><span>thesis.docx</span><span>Ln 128 · UTF-8</span></div>
  <div class="body">
    <h1>03 / 结论</h1>
    <div class="rule"></div><div class="rule"></div><div class="rule s"></div>
    <div class="rule"></div><div class="rule s"></div>
  </div>
</div>

<div class="hud">
  <span class="tag">PROTOTYPE</span>
  <button data-act="form">FORM A/B</button>
  <button data-act="deadline">DEADLINE</button>
  <button data-act="report">BOOT REPORT</button>
  <button data-act="fullscreen">FULLSCREEN</button>
  <button data-act="reset">RESET POS</button>
</div>

<aside class="panel" id="panel">
  <div id="formA">
    <div class="pname">毕业论文</div>
    <div class="track"><i class="done"></i><i class="done"></i><i class="done"></i><i></i><i></i><i></i><i></i></div>
    <p class="step">把第三章结论写成三句话</p>
    <div class="meta">STEP 03 / 07 · ~5 MIN</div>
  </div>
  <div id="formB" style="display:none">
    <div class="pname">回面试邮件</div>
    <div class="meta">STANDALONE · NO PROJECT</div>
  </div>
  <div class="ai">
    <input id="ask" placeholder="问一句，比如：这段该写什么">
    <button id="send">问</button>
  </div>
  <button class="go" id="start">开始</button>
  <div class="skip" id="skip">不做</div>
</aside>

<section class="main" id="main">
  <header><h2>PROJECTS</h2><button class="newp">+ 新建项目</button></header>
  <div class="cards">
    <div class="card"><div class="cn">毕业论文</div><div class="pct">42<small>%</small></div><div class="nx">下一步：把第三章结论写成三句话</div></div>
    <div class="card"><div class="cn">配音练习</div><div class="pct">18<small>%</small></div><div class="nx">下一步：录一段 60 秒的开场白</div></div>
    <div class="card"><div class="cn">求职</div><div class="pct">65<small>%</small></div><div class="nx">下一步：回面试邮件，约时间</div></div>
  </div>
  <div class="mods"><a href="#">记录与进度</a><a href="#">想法收件箱</a><a href="#">设置</a></div>
</section>

<div class="bubble" id="bubble"></div>

<div class="pet" id="pet">
  <img class="collapsed" src="../assets/桌宠/常驻右-240.png" alt="桌宠收起态">
  <img class="expanded" src="../assets/桌宠/展开-360.png" alt="桌宠展开态">
</div>

<div class="console" id="log"><div><b>EVENT</b> 等待操作</div></div>

<script>
(function(){
  var pet=document.getElementById('pet'), panel=document.getElementById('panel'),
      main=document.getElementById('main'), bubble=document.getElementById('bubble'),
      logBox=document.getElementById('log'), formA=document.getElementById('formA'),
      formB=document.getElementById('formB'), ask=document.getElementById('ask');
  var hoverIn=null, hoverOut=null, expanded=false, form='A', bubbleTimer=null;

  pet.style.top=(localStorage.getItem('petTop')||Math.round(innerHeight*0.42))+'px';

  function log(n,x){var d=document.createElement('div');d.innerHTML='<b>'+n+'</b>'+(x?' · '+x:'');logBox.appendChild(d);logBox.scrollTop=logBox.scrollHeight;}
  function setExpanded(v){expanded=v;pet.classList.toggle('is-expanded',v);log(v?'evt_appear 展开':'evt_appear 收起');}
  function openPanel(){var r=pet.getBoundingClientRect();
    panel.style.top=Math.max(16,Math.min(innerHeight-280,r.top+36))+'px';
    panel.style.right=(r.width-18)+'px';panel.classList.add('on');log('evt_step_shown');}
  function closePanel(){panel.classList.remove('on');}

  pet.addEventListener('pointerenter',function(){clearTimeout(hoverOut);hoverIn=setTimeout(openPanel,300);});
  pet.addEventListener('pointerleave',function(){clearTimeout(hoverIn);hoverOut=setTimeout(closePanel,500);});
  panel.addEventListener('pointerenter',function(){clearTimeout(hoverOut);});
  panel.addEventListener('pointerleave',function(){hoverOut=setTimeout(closePanel,500);});

  var dragging=false,startY=0,startTop=0,dragMoved=false;
  pet.addEventListener('pointerdown',function(e){dragging=true;dragMoved=false;startY=e.clientY;
    startTop=parseFloat(pet.style.top)||0;pet.setPointerCapture(e.pointerId);});
  pet.addEventListener('pointermove',function(e){if(!dragging)return;var dy=e.clientY-startY;
    if(Math.abs(dy)>4)dragMoved=true;var top=Math.max(0,Math.min(innerHeight-360,startTop+dy));
    pet.style.top=top+'px';localStorage.setItem('petTop',Math.round(top));});
  pet.addEventListener('pointerup',function(){dragging=false;setTimeout(function(){dragMoved=false;},50);});

  pet.addEventListener('click',function(){if(dragMoved)return;
    if(!expanded){setExpanded(true);main.classList.add('on');log('evt_panel_open','主界面滑出');}
    else{setExpanded(false);main.classList.remove('on');}});

  document.getElementById('start').addEventListener('click',function(){log('evt_start','project=毕业论文');closePanel();});
  document.getElementById('skip').addEventListener('click',function(){log('evt_skip','悬停面板');closePanel();});
  document.getElementById('send').addEventListener('click',function(){if(!ask.value.trim())return;
    log('ask_ai',ask.value.slice(0,12));ask.value='';ask.placeholder='答：先写一句话，用来占位';});

  function showBubble(kind){var r=pet.getBoundingClientRect();
    bubble.className='bubble on '+(kind==='deadline'?'deadline':'report');
    bubble.innerHTML = kind==='deadline'
      ? '<div class="bt">DEADLINE · 23:59</div>笔试确认邮件需要回复，不回就没有这次机会。<div class="bx"><span>不自动消失</span><button id="ok">知道了</button></div>'
      : '<div class="bt">BOOT REPORT</div>毕业论文 42%，已 3 天未推进；配音练习 18%，昨天推进过。<div class="bx"><span>15 秒后自动收起</span><button id="ok2">查看</button></div>';
    bubble.style.top=Math.max(12,r.top-8)+'px';bubble.style.right=(r.width+16)+'px';
    log(kind==='deadline'?'evt_bubble_show 截止':'evt_bubble_show 播报');
    clearTimeout(bubbleTimer);
    var btn=bubble.querySelector('#ok')||bubble.querySelector('#ok2');
    btn.addEventListener('click',function(){bubble.classList.remove('on');});
    if(kind!=='deadline')bubbleTimer=setTimeout(function(){bubble.classList.remove('on');log('evt_bubble_ignore','播报');},15000);}

  document.querySelector('.hud').addEventListener('click',function(e){var act=e.target.dataset.act;if(!act)return;
    if(act==='form'){form=form==='A'?'B':'A';formA.style.display=form==='A'?'':'none';
      formB.style.display=form==='B'?'':'none';openPanel();}
    if(act==='deadline')showBubble('deadline');
    if(act==='report')showBubble('report');
    if(act==='fullscreen'){pet.style.display=pet.style.display==='none'?'':'none';log('全屏降级','宠物隐藏');}
    if(act==='reset'){localStorage.removeItem('petTop');pet.style.top=Math.round(innerHeight*0.42)+'px';}});

  document.addEventListener('keydown',function(e){if(e.key==='Escape'){closePanel();
    if(expanded){setExpanded(false);main.classList.remove('on');}bubble.classList.remove('on');}});
  main.addEventListener('click',function(e){if(e.target===main){setExpanded(false);main.classList.remove('on');}});
})();
</script>
</body>
</html>
